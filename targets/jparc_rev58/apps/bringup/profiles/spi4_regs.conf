CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_SPI=y
CONFIG_JPARC_SPI4_REGS_TEST=y
# Required by the server's SO_RCVTIMEO/SO_SNDTIMEO socket options.
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
